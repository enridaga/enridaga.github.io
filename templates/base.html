<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }} — {{ site.position }}, {{ site.affiliation }}{% endblock %}</title>
  <meta name="description" content="{{ site.name }}, {{ site.position }}, {{ site.affiliation }}.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.name }}">
  <meta property="og:description" content="{{ site.position }}, {{ site.affiliation }}">
  {% if site.photo %}<meta property="og:image" content="{{ site.photo }}">{% endif %}
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main>
{% block body %}{% endblock %}
</main>
<footer>© {{ today.year }} {{ site.name }}</footer>
</body>
</html>
